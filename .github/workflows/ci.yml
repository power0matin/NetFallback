name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Manifest and script tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/check_sources.py tests/test_sources.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON manifest
        run: python -m json.tool sources.json > /dev/null
